<!doctype html>
<html lang="en">
  <meta charset="utf-8" /><meta
    name="viewport"
    content="width=device-width"
  /><title>Social Focus</title
  ><link rel="stylesheet" href="popup.css" />
  <body>
    <h1>Social Focus</h1>
    <p>Open with a purpose.</p>
    <nav>
      <a href="https://www.instagram.com/direct/inbox/" target="_blank"
        >Instagram messages</a
      ><a href="https://www.tiktok.com/messages" target="_blank"
        >TikTok messages</a
      ><a href="https://www.tiktok.com/upload" target="_blank">TikTok upload</a>
    </nav>
    <form id="profile">
      <label
        >Platform
        <select id="platform">
          <option value="instagram">Instagram</option>
          <option value="tiktok">TikTok</option>
        </select></label
      ><label
        >Account handle
        <input
          id="handle"
          required
          pattern="[A-Za-z0-9._]{1,30}"
          maxlength="30"
          autocomplete="off" /></label
      ><button>Open profile</button>
    </form>
    <fieldset>
      <legend>Blocked features</legend>
      <label><input type="checkbox" id="feeds" />Feeds</label
      ><label><input type="checkbox" id="reels" />Reels / videos</label
      ><label><input type="checkbox" id="stories" />Stories</label
      ><label><input type="checkbox" id="explore" />Discovery</label>
    </fieldset>
    <p id="status" role="status">Loading settings…</p>
    <small
      >Enabled filters are not proof of live compatibility. Native apps and
      other browsers remain unfiltered.</small
    >
    <script src="popup.js"></script>
  </body>
</html>
